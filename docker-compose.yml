services:
  web:
    build: .
    image: solartoolshub:latest
    container_name: solartoolshub-web
    ports:
      - "8080:80"
    restart: unless-stopped

  # Free Cloudflare quick tunnel – prints a https://*.trycloudflare.com URL in its logs.
  # For the real domain, replace with: tunnel --no-autoupdate run --token <TUNNEL_TOKEN>
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: solartoolshub-tunnel
    command: tunnel --no-autoupdate --url http://web:80
    depends_on:
      - web
    restart: unless-stopped
