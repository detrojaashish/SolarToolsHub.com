server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript text/javascript application/json application/xml image/svg+xml application/manifest+json;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # avoid redirects exposing the internal port
  absolute_redirect off;
  error_page 404 /404.html;

  # ── one canonical URL per page (matches <link rel="canonical"> and the sitemap) ──
  # /index.html and /foo/index.html -> clean URL (language home pages keep their slash)
  if ($request_uri ~ "^/(hi|gu|mr)/index\.html(?:\?.*)?$") { return 301 /$1/; }
  if ($request_uri ~ "^/(?:(.*)/)?index\.html(?:\?.*)?$") { return 301 /$1; }
  # language home pages keep their slash
  location ~ ^/(hi|gu|mr)$ { return 301 /$1/; }
  # every other URL has no trailing slash: /solar-calculator/ -> /solar-calculator
  rewrite ^/(?!(?:hi|gu|mr)/$)(.+)/$ /$1 permanent;

  # hashed assets and fonts: cache forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  location ~* \.(?:jpg|jpeg|png|webp|svg|ico|webmanifest)$ {
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  location ~ ^/(sitemap\.xml|robots\.txt|ads\.txt)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }
  # the error page itself must never be indexed
  location = /404.html {
    internal;
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control "no-store";
  }

  # clean URLs: /solar-calculator -> /solar-calculator/index.html (no redirect)
  location / {
    add_header Cache-Control "public, max-age=600, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    try_files $uri $uri/index.html =404;
  }
}
